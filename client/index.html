<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15100a" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet" />
    <title>🪨 Stone Daily</title>
    <script>
      // Dark mode optionnel : on suit la préférence OS. Appliqué avant le rendu
      // (pas de flash). Les classes dark: du markup deviennent ainsi actives.
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function (on) { document.documentElement.classList.toggle('dark', on); };
        apply(mq.matches);
        mq.addEventListener('change', function (e) { apply(e.matches); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
